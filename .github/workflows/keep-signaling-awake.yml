# Бесплатный Render усыпляет сервис после ~15 минут без обращений, и первое подключение приложения
# после паузы занимает десятки секунд (холодный старт). Этот рабочий процесс раз в 10 минут обращается
# к /health, чтобы сигнальный сервер оставался «тёплым».
# Если вы переехали на платный тариф или свой хостинг, файл можно удалить.
name: Keep signaling server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" --max-time 60 --retry 2 --retry-delay 5 \
            "https://ether-1-baqy.onrender.com/health" || echo "server did not answer (it may be waking up)"
