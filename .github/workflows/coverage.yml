# Покрытие тестами (пороги: строки >= 90%, ветвления >= 80%). Долгий замер — раз в неделю и вручную, не на каждый push.
name: Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            signaling-server/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm ci
        working-directory: signaling-server
      - name: Client coverage
        run: node tools/coverage.js client
      - name: Server coverage
        run: node tools/coverage.js server
