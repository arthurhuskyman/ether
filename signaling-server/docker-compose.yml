# killer-features-backlog 0.2 — "свой сервер" как оформленная фича.
# Запуск: cp .env.example .env (заполнить значения) && docker compose up -d
services:
  ether-signaling:
    build: .
    container_name: ether-signaling
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      # внутри контейнера всегда 8787 (иначе PORT из .env ломает проброс портов); хост-порт задаётся PORT в .env
      PORT: "8787"
      DATA_DIR: /data
      # Раскомментируйте, если перед контейнером стоит reverse-proxy (Caddy/nginx/Traefik): IP клиента берётся из последней записи X-Forwarded-For.
      # Без прокси (порт открыт напрямую) НЕ включайте — заголовок подделывается клиентом.
      # TRUST_PROXY: "1"
    volumes:
      - ./data:/data
